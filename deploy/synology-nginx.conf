# 群晖 Nginx 反向代理配置示例
# 适用场景：群晖 DSM 使用反向代理网关，绑定域名 + HTTPS 访问
#
# 使用方法：
# 1. 控制面板 -> 登录门户 -> 高级 -> 反向代理
# 2. 或者将此文件内容粘贴到自定义 Web Station 配置
# 3. 或者放到 /etc/nginx/sites-enabled/ 下（需 root 权限）

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # 改为你的域名
    server_name miktv.example.com;

    # SSL 证书（群晖默认位置，改成你自己的）
    ssl_certificate     /usr/syno/etc/certificate/system/default/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/system/default/privkey.pem;

    # 基础 SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 大文件上传/流式传输调优
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    # WebSocket 支持
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 视频流超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }
}
